name: Windows checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate synthetic examples
        run: python -c "from examples.make_examples import verify; verify()"
      - name: Run isolated regression modules
        run: python scripts/run_tests.py
      - name: Build Windows package
        shell: pwsh
        run: ./build.ps1 -PythonExe (Get-Command python).Source
      - name: Package download and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $archive = 'cad-coordinate-tool-v22.8.0-windows-x64.zip'
          Compress-Archive -LiteralPath 'dist/坐标生成器v22.8' -DestinationPath (Join-Path release $archive)
          $hash = (Get-FileHash -LiteralPath (Join-Path release $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding utf8NoBOM
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 14
